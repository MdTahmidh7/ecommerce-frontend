name: 🚀 Deploy Angular Frontend

on:
  push:
    tags:
      - "test-*"
      - "prod-*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Determine environment and set variables
      - name: Set environment
        id: set-env
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ "$TAG_NAME" == test-* ]]; then
            echo "env_name=test" >> $GITHUB_ENV
            echo "VM_HOST=${{ secrets.VM_HOST }}" >> $GITHUB_ENV
            echo "VM_USER=${{ secrets.VM_USER }}" >> $GITHUB_ENV
            echo "VM_SSH_KEY=${{ secrets.VM_SSH_KEY }}" >> $GITHUB_ENV
          elif [[ "$TAG_NAME" == prod-* ]]; then
            echo "env_name=prod" >> $GITHUB_ENV
            echo "VM_HOST=${{ secrets.PROD_VM_HOST }}" >> $GITHUB_ENV
            echo "VM_USER=${{ secrets.PROD_VM_USER }}" >> $GITHUB_ENV
            echo "VM_SSH_KEY=${{ secrets.PROD_VM_SSH_KEY }}" >> $GITHUB_ENV
          else
            echo "❌ Unknown tag format"
            exit 1
          fi

      # 3️⃣ Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ env.VM_SSH_KEY }}

      # 4️⃣ Add VM to known_hosts
      - name: Add VM to known_hosts
        run: ssh-keyscan -H $VM_HOST >> ~/.ssh/known_hosts

      # 5️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 6️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 7️⃣ Build Angular app
      - name: Build Angular project
        run: |
          if [[ "$env_name" == "test" ]]; then
            npm run build -- --configuration test
          else
            npm run build -- --configuration production
          fi

      # 8️⃣ Clean old frontend files on VM
      - name: Clean old frontend files
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << EOF
            rm -rf /home/$VM_USER/frontend/*
          EOF

      # 9️⃣ Copy new build to VM
      - name: Copy build to VM
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./dist/ecommerce-frontend/browser/ \
          $VM_USER@$VM_HOST:/home/$VM_USER/frontend/

      # 🔟 Create Nginx config
      - name: Create Nginx config
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
            cat > /home/$VM_USER/frontend/nginx.conf << 'EOL'
            server {
              listen 80;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              location / {
                try_files \$uri /index.html;
              }

              location /api/ {
                proxy_pass http://127.0.0.1:8080;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
              }

              location /assets/ {
                try_files \$uri =404;
              }

              client_max_body_size 10M;
            }
            EOL
          EOF

      # 11️⃣ Run Nginx container
      - name: Serve Angular with Nginx
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << EOF
            docker rm -f angular-frontend || true
            docker run --name angular-frontend -d -p 80:80 \
              -v /home/$VM_USER/frontend:/usr/share/nginx/html:ro \
              -v /home/$VM_USER/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              --restart always nginx:latest
          EOF
