name: Frontend CI/CD (Angular + Nginx)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VM_USER: ${{ secrets.PROD_VM_USER }}
      VM_HOST: ${{ secrets.PROD_VM_HOST }}

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build Angular (production)
      - name: Build Angular app
        run: npm run build -- --configuration production

      # 5️⃣ Verify build output (DEBUG – VERY IMPORTANT)
      - name: Verify dist folder
        run: |
          echo "==== ROOT ===="
          ls -l
          echo "==== DIST ===="
          ls -l dist
          echo "==== BROWSER BUILD ===="
          ls -l dist/ecommerce-frontend/browser
          echo "==== NGINX FILE ===="
          ls -l nginx

      # 6️⃣ Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_VM_SSH_KEY }}

        # 7️⃣ Ensure server directories exist (Matched to Docker mount)
      - name: Prepare server directories
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
            mkdir -p /home/root/frontend/nginx
          EOF
        # 8️⃣ Upload built files to server
      - name: Upload built files to server
        run: |
          scp -o StrictHostKeyChecking=no -r dist/ecommerce-frontend/browser/* $VM_USER@$VM_HOST:/home/root/frontend/
          scp -o StrictHostKeyChecking=no -r nginx/* $VM_USER@$VM_HOST:/home/root/frontend/nginx/
        # 9️⃣ Verify files on server (DEBUG – VERY IMPORTANT)
      - name: Verify files on server
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
            echo "==== FRONTEND FILES ===="
            ls -l /home/root/frontend/
            echo "==== NGINX FILES ===="
            ls -l /home/root/frontend/nginx/
          EOF

      # 🔟 Gracefully reload, heal, or start Nginx container
      - name: Restart Nginx container
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
            echo "==== CHECKING NGINX CONTAINER STATUS ===="
            
            # 1. If angular-frontend-new is already running and healthy, reload Nginx gracefully
            if docker ps --format '{{.Names}}' | grep -q '^angular-frontend-new$'; then
              echo "angular-frontend-new is running. Gracefully reloading Nginx..."
              docker exec angular-frontend-new nginx -s reload && exit 0
            fi

            echo "Container is not actively running. Preparing clean startup..."

            # 2. Free port 80 and 443 from any conflicting containers (e.g. old angular-frontend)
            for PORT in 80 443; do
              OCCUPYING_CONTAINERS=$(docker ps -q --filter "publish=$PORT")
              if [ -n "$OCCUPYING_CONTAINERS" ]; then
                echo "Removing conflicting container(s) on port $PORT..."
                docker rm -f $OCCUPYING_CONTAINERS 2>/dev/null || true
              fi
            done

            # Ensure both angular-frontend and angular-frontend-new are removed before fresh run
            docker rm -f angular-frontend angular-frontend-new 2>/dev/null || true

            # 3. Check if a native host service (e.g. system nginx/apache) is binding port 80
            if ss -tuln 2>/dev/null | grep -E ':80\s|:443\s'; then
              echo "Stopping native host web services on port 80/443..."
              systemctl stop nginx 2>/dev/null || true
              systemctl stop apache2 2>/dev/null || true
              fuser -k 80/tcp 2>/dev/null || true
              fuser -k 443/tcp 2>/dev/null || true
            fi

            # 4. Discover active ecommerce/backend network
            ACTIVE_NET=$(docker network ls --format '{{.Name}}' | grep -E 'ecommerce|backend' | head -n 1)
            echo "Using active network: ${ACTIVE_NET:-bridge}"

            # 5. Start fresh Nginx container
            echo "Starting angular-frontend-new container..."
            docker run -d \
              --name angular-frontend-new \
              ${ACTIVE_NET:+--network "$ACTIVE_NET"} \
              -p 80:80 \
              -p 443:443 \
              -v /home/root/frontend:/usr/share/nginx/html:ro \
              -v /home/root/frontend/nginx:/etc/nginx/conf.d:ro \
              -v /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro \
              --restart always \
              nginx:latest

            echo "==== NGINX CONTAINER CURRENT STATUS ===="
            docker ps --filter "name=angular-frontend-new"
          EOF
