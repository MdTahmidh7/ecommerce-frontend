name: 🚀 Deploy Angular Frontend

on:
  push:
    tags:
      - "test-*"
      - "prod-*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Detect environment
      - name: Set environment Name
        id: set-env
        run: |
          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" == test-* ]]; then
            echo "env_name=test" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == prod-* ]]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
          else
            echo "Unknown tag format"
            exit 1
          fi

      # 3️⃣ Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{
            steps.set-env.outputs.env_name == 'test'
            && secrets.VM_SSH_KEY
            || secrets.PROD_VM_SSH_KEY}}

      # 4️⃣ Add VPS as known host
      - name: Add VM to known_hosts
        env:
          VM_HOST: ${{
            steps.set-env.outputs.env_name == 'test'
            && secrets.VM_HOST
            || secrets.PROD_VM_HOST}}
        run: ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      # 5️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 6️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 7️⃣ Build Angular
      - name: Build Angular
        run: |
          if [[ "${{ steps.set-env.outputs.env_name }}" == "test" ]]; then
            npm run build -- --configuration test
          else
            npm run build -- --configuration production
          fi

      # 8️⃣ Clean old frontend files
      - name: Clean old frontend
        env:
          VM_USER: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_USER || secrets.PROD_VM_USER }}
          VM_HOST: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_HOST || secrets.PROD_VM_HOST }}
        run: |
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} << 'EOF'
            rm -rf /home/$(whoami)/frontend/*
            mkdir -p /home/$(whoami)/frontend
          EOF

      # 9️⃣ Upload Angular build
      - name: Upload build
        env:
          VM_USER: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_USER || secrets.PROD_VM_USER }}
          VM_HOST: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_HOST || secrets.PROD_VM_HOST }}
        run: |
          rsync -avz --delete -e "ssh" ./dist/ecommerce-frontend/browser/ \
          ${{ env.VM_USER }}@${{ env.VM_HOST }}:/home/${{ env.VM_USER }}/frontend/

      # 🔟 Write Nginx config on VPS
      - name: Write Nginx config
        env:
          VM_USER: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_USER || secrets.PROD_VM_USER }}
          VM_HOST: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_HOST || secrets.PROD_VM_HOST }}
        run: |
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} "cat << 'EOL' > /home/${{ env.VM_USER }}/frontend/default.conf
          server {
          listen 80;
          server_name _;

          root /usr/share/nginx/html;
          index index.html;

          location / {
          try_files \$uri \$uri/ /index.html;
          }
          location /api/ {
          proxy_pass http://127.0.0.1:8080/;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          }
          location /assets/ {
            try_files \$uri =404;
          }

          client_max_body_size 10M;
          }
          EOL"


      # 1️⃣1️⃣ Run updated Nginx container
      - name: Run Nginx container
        env:
          VM_USER: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_USER || secrets.PROD_VM_USER }}
          VM_HOST: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_HOST || secrets.PROD_VM_HOST }}
        run: |
          ssh ${{ env.VM_USER }}@${{ env.VM_HOST }} << 'EOF'
            docker rm -f angular-frontend || true

            docker run -d --name angular-frontend -p 80:80 \
              -v /home/$(whoami)/frontend:/usr/share/nginx/html:ro \
              -v /home/$(whoami)/frontend/default.conf:/etc/nginx/conf.d/default.conf:ro \
              --restart always nginx:latest
          EOF
