name: Deploy Angular Frontend

# Trigger workflow on tag push
on:
  push:
    tags:
      - 'deploy-*'   # any tag starting with deploy-

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up SSH
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      # 3️⃣ Set up Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 4️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: ./   # adjust if your Angular project is in a subfolder

      # 5️⃣ Build Angular project
      - name: Build Angular project
        run: npm run build -- --configuration production
        working-directory: ./   # adjust if your Angular project is in a subfolder

      # 6️⃣ Copy build to VM
      - name: Copy build to VM
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./dist/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/frontend

      # 7️⃣ Serve Angular with Nginx Docker container
      - name: Serve Angular with Nginx
        run: |
          ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            # Remove old container if exists
            docker rm -f angular-frontend || true

            # Run Nginx container serving Angular
            docker run --name angular-frontend -d -p 80:80 \
              -v /home/${{ secrets.VM_USER }}/frontend:/usr/share/nginx/html:ro \
              --restart always nginx:latest
          EOF
