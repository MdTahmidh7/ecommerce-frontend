name: Frontend CI/CD (Angular + Nginx)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VM_USER: ${{ secrets.VM_USER }}
      VM_HOST: ${{ secrets.VM_HOST }}

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build Angular (production)
      - name: Build Angular app
        run: npm run build -- --configuration production

      # 5️⃣ Verify build output (DEBUG – VERY IMPORTANT)
      - name: Verify dist folder
        run: |
          echo "==== ROOT ===="
          ls -l
          echo "==== DIST ===="
          ls -l dist
          echo "==== BROWSER BUILD ===="
          ls -l dist/ecommerce-frontend/browser
          echo "==== NGINX FILE ===="
          ls -l nginx

      # 6️⃣ Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      # 7️⃣ Ensure server directories exist
      - name: Prepare server directories
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
            mkdir -p /home/$USER/frontend
            mkdir -p /home/$USER/frontend/nginx-conf
          EOF

      # 8️⃣ Upload Angular static files
      - name: Upload Angular static build
        run: |
          rsync -avz --delete \
          ./dist/ecommerce-frontend/browser/ \
          $VM_USER@$VM_HOST:/home/$VM_USER/frontend/

      # 9️⃣ Upload Nginx default.conf
      - name: Upload Nginx default.conf
        run: |
          rsync -avz \
          ./nginx/default.conf \
          $VM_USER@$VM_HOST:/home/$VM_USER/frontend/nginx-conf/default.conf

      # 🔟 Restart Nginx container
      - name: Restart Nginx container
        run: |
          ssh $VM_USER@$VM_HOST << 'EOF'
            docker restart angular-frontend-new
          EOF
