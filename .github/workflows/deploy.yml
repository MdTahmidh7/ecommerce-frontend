name: 🚀 Deploy Angular Frontend

on:
  push:
    tags:
      - "test-*"
      - "prod-*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Detect environment and set variables (FIXED: Uses $GITHUB_OUTPUT for secrets)
      - name: Set environment
        id: set-env # Added ID to reference outputs
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ "$TAG_NAME" == test-* ]]; then
            # Write variables to GITHUB_OUTPUT
            echo "env_name=test" >> $GITHUB_OUTPUT
            echo "vm_host=${{ secrets.VM_HOST }}" >> $GITHUB_OUTPUT
            echo "vm_user=${{ secrets.VM_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key=${{ secrets.VM_SSH_KEY }}" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == prod-* ]]; then
            # Write variables to GITHUB_OUTPUT
            echo "env_name=prod" >> $GITHUB_OUTPUT
            echo "vm_host=${{ secrets.PROD_VM_HOST }}" >> $GITHUB_OUTPUT
            echo "vm_user=${{ secrets.PROD_VM_USER }}" >> $GITHUB_OUTPUT
            echo "ssh_key=${{ secrets.PROD_VM_SSH_KEY }}" >> $GITHUB_OUTPUT
          else
            echo "❌ Unknown tag format: $TAG_NAME"
            exit 1
          fi

      # 3️⃣ Setup SSH (Updated to use step outputs)
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ steps.set-env.outputs.ssh_key }}

      # 4️⃣ Add host to known_hosts (Updated to use step outputs)
      - name: Add VM to known_hosts
        run: ssh-keyscan -H ${{ steps.set-env.outputs.vm_host }} >> ~/.ssh/known_hosts

      # 5️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 6️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 7️⃣ Build Angular app (Updated to use step outputs)
      - name: Build Angular project
        run: |
          # Use step output for env_name
          ENV_NAME="${{ steps.set-env.outputs.env_name }}"
          if [[ "${ENV_NAME}" == "test" ]]; then
            npm run build -- --configuration test
          else
            npm run build -- --configuration production
          fi

      # 8️⃣ Clean old frontend files on VM (Updated to use step outputs)
      - name: Clean old frontend files
        run: |
          ssh -o StrictHostKeyChecking=no ${{ steps.set-env.outputs.vm_user }}@${{ steps.set-env.outputs.vm_host }} << 'EOF'
            VM_USER=$(whoami) # Get actual user on the VM
            rm -rf /home/${VM_USER}/frontend/*
          EOF

      # 9️⃣ Copy build files to VM (Updated to use step outputs)
      - name: Copy build to VM
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./dist/ecommerce-frontend/browser/ \
          ${{ steps.set-env.outputs.vm_user }}@${{ steps.set-env.outputs.vm_host }}:/home/${{ steps.set-env.outputs.vm_user }}/frontend/

      # 🔟 Create Nginx config (Updated to use step outputs)
      - name: Create Nginx config
        run: |
          ssh -o StrictHostKeyChecking=no ${{ steps.set-env.outputs.vm_user }}@${{ steps.set-env.outputs.vm_host }} << 'EOF'
            VM_USER=$(whoami) # Get actual user on the VM
            cat > /home/${VM_USER}/frontend/nginx.conf << 'EOL'
            server {
              listen 80;
              server_name _;

              root /usr/share/nginx/html;
              index index.html;

              location / {
                try_files \$uri /index.html;
              }

              location /api/ {
                proxy_pass http://127.0.0.1:8080;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto \$scheme;
              }

              location /assets/ {
                try_files \$uri =404;
              }

              client_max_body_size 10M;
            }
            EOL
          EOF

      # 11️⃣ Run Nginx container (Updated to use step outputs)
      - name: Serve Angular with Nginx
        run: |
          ssh -o StrictHostKeyChecking=no ${{ steps.set-env.outputs.vm_user }}@${{ steps.set-env.outputs.vm_host }} << 'EOF'
            VM_USER=$(whoami) # Get actual user on the VM
            docker rm -f angular-frontend || true
            docker run --name angular-frontend -d -p 80:80 \
              -v /home/${VM_USER}/frontend:/usr/share/nginx/html:ro \
              -v /home/${VM_USER}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              --restart always nginx:latest
          EOF
