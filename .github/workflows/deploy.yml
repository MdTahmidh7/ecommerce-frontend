name: Deploy Angular Frontend

on:
  push:
    tags:
      - 'deploy-*'   # Trigger on tags like deploy-v1.0

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set up SSH
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VM_SSH_KEY }}

      # 3️⃣ Add VM host to known_hosts
      - name: Add VM to known_hosts
        run: ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

      # 4️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # 5️⃣ Install Angular dependencies
      - name: Install dependencies
        run: npm ci
        working-directory: ./

      # 6️⃣ Build Angular project
      - name: Build Angular project
        run: npm run build -- --configuration production
        working-directory: ./

      # 7️⃣ Clean old frontend files on VM
      - name: Clean old frontend files on VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            rm -rf /home/${{ secrets.VM_USER }}/frontend/*
          EOF

      # 8️⃣ Copy build to VM
      - name: Copy build to VM
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./dist/ecommerce-frontend/browser/ ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/home/${{ secrets.VM_USER }}/frontend/

      # 9️⃣ Create Nginx config for Angular SPA
      - name: Create Nginx config
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            cat > /home/${{ secrets.VM_USER }}/frontend/nginx.conf << 'EOL'
            server {
            listen 80;
            server_name _;

            root /usr/share/nginx/html;
            index index.html;

          # Angular SPA routing
            location / {
            try_files $uri /index.html;
          }

          # Proxy API requests to backend
            location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
          }

          location /assets/ {
            try_files $uri =404;
          }

            client_max_body_size 10M;
          }

      # 🔟 Serve with Nginx container
      - name: Serve Angular with Nginx
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << 'EOF'
            docker rm -f angular-frontend || true
            docker run --name angular-frontend -d -p 80:80 \
              -v /home/${{ secrets.VM_USER }}/frontend:/usr/share/nginx/html:ro \
              -v /home/${{ secrets.VM_USER }}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              --restart always nginx:latest
          EOF
