name: 🚀 Deploy Angular Frontend

on:
  push:
    tags:
      - "test-*"
      - "prod-*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Detect environment and set non-secret variable
      - name: Set environment Name (Non-Secret)
        id: set-env
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"

          if [[ "$TAG_NAME" == test-* ]]; then
            echo "env_name=test" >> $GITHUB_OUTPUT
          elif [[ "$TAG_NAME" == prod-* ]]; then
            echo "env_name=production" >> $GITHUB_OUTPUT
          else
            echo "❌ Unknown tag format: $TAG_NAME"
            exit 1
          fi

      # 3️⃣ Setup SSH (Uses direct conditional access for the secret)
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Select the correct SSH key based on the tag
          ssh-private-key: ${{
            steps.set-env.outputs.env_name == 'test' && secrets.VM_SSH_KEY ||
            secrets.PROD_VM_SSH_KEY
            }}

      # 4️⃣ Add host to known_hosts (Uses direct conditional access for the host)
      - name: Add VM to known_hosts
        env:
          VM_HOST: ${{
            steps.set-env.outputs.env_name == 'test' && secrets.VM_HOST ||
            secrets.PROD_VM_HOST
            }}
        run: ssh-keyscan -H ${{ env.VM_HOST }} >> ~/.ssh/known_hosts

      # 5️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 6️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 7️⃣ Build Angular app (Uses env_name from step output)
      - name: Build Angular project
        run: |
          ENV_NAME="${{ steps.set-env.outputs.env_name }}"
          if [[ "${ENV_NAME}" == "test" ]]; then
            npm run build -- --configuration test
          else
            npm run build -- --configuration production
          fi

      # 8️⃣ Clean old frontend files on VM (INDENTATION FIXED)
      - name: Clean old frontend files
        env:
          VM_USER: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_USER || secrets.PROD_VM_USER }}
          VM_HOST: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_HOST || secrets.PROD_VM_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.VM_USER }}@${{ env.VM_HOST }} << 'EOF'
            VM_USER_REMOTE=$(whoami)
            rm -rf /home/${VM_USER_REMOTE}/frontend/*
          EOF

      # 9️⃣ Copy build files to VM (INDENTATION FIXED)
      - name: Copy build to VM
        env:
          VM_USER: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_USER || secrets.PROD_VM_USER }}
          VM_HOST: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_HOST || secrets.PROD_VM_HOST }}
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" ./dist/ecommerce-frontend/browser/ \
          ${{ env.VM_USER }}@${{ env.VM_HOST }}:/home/${{ env.VM_USER }}/frontend/

      # 🔟 Create Nginx config (INDENTATION FIXED)
      - name: Create Nginx config
        env:
          VM_USER: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_USER || secrets.PROD_VM_USER }}
          VM_HOST: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_HOST || secrets.PROD_VM_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.VM_USER }}@${{ env.VM_HOST }} << 'EOF'
            VM_USER_REMOTE=$(whoami)
            cat > /home/${VM_USER_REMOTE}/frontend/nginx.conf << EOL
            server {
              listen 80;
              server_name _;

               root /usr/share/nginx/html;
               index index.html;

                location / {
                  try_files \$uri /index.html;
                }

                location /api/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                }

                location /assets/ {
                  try_files \$uri =404;
                }

                  client_max_body_size 10M;
                }
               EOL
                # Optional: Verify syntax
                nginx -t || { echo "❌ Nginx config syntax error"; exit 1; }
          	EOF

      # 11️⃣ Run Nginx container (INDENTATION FIXED)
      - name: Serve Angular with Nginx
        env:
          VM_USER: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_USER || secrets.PROD_VM_USER }}
          VM_HOST: ${{ steps.set-env.outputs.env_name == 'test' && secrets.VM_HOST || secrets.PROD_VM_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no ${{ env.VM_USER }}@${{ env.VM_HOST }} << 'EOF'
            VM_USER_REMOTE=$(whoami)
            docker rm -f angular-frontend || true
            docker run --name angular-frontend -d -p 80:80 \
              -v /home/${VM_USER_REMOTE}/frontend:/usr/share/nginx/html:ro \
              -v /home/${VM_USER_REMOTE}/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              --restart always nginx:latest
          EOF
