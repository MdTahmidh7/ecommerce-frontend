name: Frontend CI/CD (Angular + Nginx)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VM_USER: ${{ secrets.PROD_VM_USER }}
      VM_HOST: ${{ secrets.PROD_VM_HOST }}

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build Angular (production)
      - name: Build Angular app
        run: npm run build -- --configuration production

      # 5️⃣ Verify build output (DEBUG – VERY IMPORTANT)
      - name: Verify dist folder
        run: |
          echo "==== ROOT ===="
          ls -l
          echo "==== DIST ===="
          ls -l dist
          echo "==== BROWSER BUILD ===="
          ls -l dist/ecommerce-frontend/browser
          echo "==== NGINX FILE ===="
          ls -l nginx

      # 6️⃣ Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_VM_SSH_KEY }}

        # 7️⃣ Ensure server directories exist (Matched to Docker mount)
      - name: Prepare server directories
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
            mkdir -p /home/root/frontend/nginx
          EOF
        # 8️⃣ Upload built files to server
      - name: Upload built files to server
        run: |
          scp -o StrictHostKeyChecking=no -r dist/ecommerce-frontend/browser/* $VM_USER@$VM_HOST:/home/root/frontend/
          scp -o StrictHostKeyChecking=no -r nginx/* $VM_USER@$VM_HOST:/home/root/frontend/nginx/
        #9️⃣ Verify files on server (DEBUG – VERY IMPORTANT)
      - name: Verify files on server
        run: |
          ssh $VM_USER@$VM_HOST << 'EOF'
            echo "==== FRONTEND FILES ===="
            ls -l /home/root/frontend/
            echo "==== NGINX FILES ===="
            ls -l /home/root/frontend/nginx/
          EOF

      # 🔟 Restart Nginx container
      - name: Restart Nginx container
        run: |
          ssh $VM_USER@$VM_HOST << 'EOF'
            docker restart angular-frontend-new
          EOF
