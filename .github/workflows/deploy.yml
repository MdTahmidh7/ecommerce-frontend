name: Frontend CI/CD (Angular + Nginx)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      VM_USER: ${{ secrets.PROD_VM_USER }}
      VM_HOST: ${{ secrets.PROD_VM_HOST }}

    steps:
      # 1️⃣ Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build Angular (production)
      - name: Build Angular app
        run: npm run build -- --configuration production

      # 5️⃣ Verify build output (DEBUG – VERY IMPORTANT)
      - name: Verify dist folder
        run: |
          echo "==== ROOT ===="
          ls -l
          echo "==== DIST ===="
          ls -l dist
          echo "==== BROWSER BUILD ===="
          ls -l dist/ecommerce-frontend/browser
          echo "==== NGINX FILE ===="
          ls -l nginx

      # 6️⃣ Setup SSH
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_VM_SSH_KEY }}

        # 7️⃣ Ensure server directories exist (Matched to Docker mount)
      - name: Prepare server directories
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
            mkdir -p /home/root/frontend/nginx
          EOF
        # 8️⃣ Upload built files to server
      - name: Upload built files to server
        run: |
          scp -o StrictHostKeyChecking=no -r dist/ecommerce-frontend/browser/* $VM_USER@$VM_HOST:/home/root/frontend/
          scp -o StrictHostKeyChecking=no -r nginx/* $VM_USER@$VM_HOST:/home/root/frontend/nginx/
        # 9️⃣ Verify files on server (DEBUG – VERY IMPORTANT)
      - name: Verify files on server
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
            echo "==== FRONTEND FILES ===="
            ls -l /home/root/frontend/
            echo "==== NGINX FILES ===="
            ls -l /home/root/frontend/nginx/
          EOF

      # 🔟 Gracefully reload, heal, or start Nginx container
      - name: Restart Nginx container
        run: |
          ssh -o StrictHostKeyChecking=no $VM_USER@$VM_HOST << 'EOF'
            echo "==== CHECKING NGINX CONTAINER STATUS ===="
            
            # Check if container exists
            if docker ps -a --format '{{.Names}}' | grep -q '^angular-frontend-new$'; then
              # If running, attempt zero-downtime graceful reload
              if docker ps --format '{{.Names}}' | grep -q '^angular-frontend-new$'; then
                echo "Container is running. Gracefully reloading Nginx..."
                docker exec angular-frontend-new nginx -s reload || docker restart angular-frontend-new
              else
                echo "Container is stopped. Attempting safe start with network repair..."
                # Disconnect any stale or deleted ghost networks
                docker inspect angular-frontend-new --format '{{range $net, $conf := .NetworkSettings.Networks}}{{$net}} {{end}}' 2>/dev/null | xargs -n1 -I{} docker network disconnect -f {} angular-frontend-new 2>/dev/null || true
                
                # Discover active ecommerce/backend network
                ACTIVE_NET=$(docker network ls --format '{{.Name}}' | grep -E 'ecommerce|backend' | head -n 1)
                if [ -n "$ACTIVE_NET" ]; then
                  echo "Attaching container to active network: $ACTIVE_NET"
                  docker network connect "$ACTIVE_NET" angular-frontend-new 2>/dev/null || true
                fi
                
                # Start or recreate if starting fails
                docker start angular-frontend-new || {
                  echo "Start failed. Recreating container fresh..."
                  docker rm -f angular-frontend-new
                  docker run -d \
                    --name angular-frontend-new \
                    ${ACTIVE_NET:+--network "$ACTIVE_NET"} \
                    -p 80:80 \
                    -p 443:443 \
                    -v /home/root/frontend:/usr/share/nginx/html:ro \
                    -v /home/root/frontend/nginx:/etc/nginx/conf.d:ro \
                    -v /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro \
                    --restart always \
                    nginx:latest
                }
              fi
            else
              echo "Container does not exist. Creating new container..."
              ACTIVE_NET=$(docker network ls --format '{{.Name}}' | grep -E 'ecommerce|backend' | head -n 1)
              docker run -d \
                --name angular-frontend-new \
                ${ACTIVE_NET:+--network "$ACTIVE_NET"} \
                -p 80:80 \
                -p 443:443 \
                -v /home/root/frontend:/usr/share/nginx/html:ro \
                -v /home/root/frontend/nginx:/etc/nginx/conf.d:ro \
                -v /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro \
                --restart always \
                nginx:latest
            fi

            echo "==== NGINX CONTAINER CURRENT STATUS ===="
            docker ps --filter "name=angular-frontend-new"
          EOF
