# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Upstreams
upstream backend {
    server ecommerce_backend_app:8080;
}

upstream minio {
    server ecommerce_minio:9000;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    # SSL configuration
    ssl_certificate /etc/ssl/cloudflare/cloudflare.crt;
    ssl_certificate_key /etc/ssl/cloudflare/cloudflare.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # 1️⃣ API proxy to backend
    # Use ^~ to give this block priority over the Angular catch-all
    location ^~ /api/ {
        # Using the upstream name. The trailing slash / ensures
        # the path is passed correctly to Spring Boot.
        proxy_pass http://backend/api/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Increased timeouts for larger API responses
        proxy_connect_timeout 90;
        proxy_send_timeout 90;
        proxy_read_timeout 90;
    }

    # 2️⃣ MinIO images proxy
    location ^~ /ecommerce-products/ {
        proxy_pass http://minio/ecommerce-products/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # 3️⃣ Static assets
    location /assets/ {
        try_files $uri =404;
    }

    # 4️⃣ Angular app routing (The Catch-all)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Limits & Performance
    client_max_body_size 20M;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Debug header (Optional: helps confirm Nginx is working)
    add_header X-Served-By "Nginx-Container";
}
