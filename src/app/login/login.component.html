<div class="">
  <div class="login-wrapper">
    <!-- Background Animation -->
    <!-- Login Card -->
    <div class="login-card">
      <div class="card-header">
        <div class="logo-container">
          <div class="logo-icon">
            <i class="fas fa-shopping-bag"></i>
          </div>
          <h1 class="brand-title">ShopZone</h1>
        </div>
        <h2 class="login-title">Welcome Back!</h2>
        <p class="login-subtitle">Sign in to your account to continue</p>
      </div>

      <div class="card-body">
        <!-- Alert Messages -->
        <div class="alert alert-success animate__animated animate__fadeIn" *ngIf="successMessage">
          <i class="fas fa-check-circle"></i>
          {{ successMessage }}
        </div>

        <div class="alert alert-danger animate__animated animate__shakeX" *ngIf="errorMessage">
          <i class="fas fa-exclamation-triangle"></i>
          {{ errorMessage }}
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit(content)" class="login-form" novalidate>

          <!--Name Input-->
          <div class="input-group-custom">
            <label for="phoneNo" class="form-label-custom">Name</label>
            <div class="input-wrapper" [class.has-error]="isFieldInvalid('name')" [class.has-success]="isFieldValid('name')">
              <div class="input-icon px-1">
                <i class="fas fa-user"></i>
              </div>
              <input
                type="text"
                class="form-control-custom"
                id="name"
                formControlName="name"
                placeholder="Enter your name"
                [class.is-invalid]="isFieldInvalid('name')"
                [class.is-valid]="isFieldValid('name')"
              />

              <div class="validation-icon" *ngIf="isFieldValid('name')">
                <i class="fas fa-check"></i>
              </div>
            </div>

            <!-- phoneNo Error Messages -->
            <div class="input-error animate__animated animate__fadeInUp" *ngIf="loginForm.get('name')?.touched && loginForm.get('name')?.errors">
              <i class="fas fa-exclamation-circle"></i>
              <span *ngIf="loginForm.get('name')?.errors?.['required']">phoneNo is required</span>
              <span *ngIf="loginForm.get('name')?.errors?.['name']">Please enter a valid phoneNo</span>
            </div>
          </div>

          <!-- Mobile Input -->
          <div class="input-group-custom">
            <label for="phoneNo" class="form-label-custom">Phone Number</label>
            <div class="input-wrapper" [class.has-error]="isFieldInvalid('phoneNo')" [class.has-success]="isFieldValid('phoneNo')">
              <div class="input-icon px-1">
                <i class="fas fa-phone"></i>
              </div>
              <input
                type="text"
                class="form-control-custom"
                id="phoneNo"
                formControlName="phoneNo"
                placeholder="Enter your mobile number"
                [class.is-invalid]="isFieldInvalid('phoneNo')"
                [class.is-valid]="isFieldValid('phoneNo')"
              />

              <div class="validation-icon" *ngIf="isFieldValid('phoneNo')">
                <i class="fas fa-check"></i>
              </div>
            </div>

            <!-- phoneNo Error Messages -->
            <div class="input-error animate__animated animate__fadeInUp" *ngIf="loginForm.get('phoneNo')?.touched && loginForm.get('phoneNo')?.errors">
              <i class="fas fa-exclamation-circle"></i>
              <span *ngIf="loginForm.get('phoneNo')?.errors?.['required']">phoneNo is required</span>
              <span *ngIf="loginForm.get('phoneNo')?.errors?.['phoneNo']">Please enter a valid phoneNo</span>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="form-options">
            <div class="remember-me">
              <input
                type="checkbox"
                id="remember"
                class="custom-checkbox"
                formControlName="rememberMe"
              >
              <label for="remember" class="checkbox-label">
                <span class="checkmark"></span>
                Remember me
              </label>
            </div>
            <a href="#" class="forgot-password" (click)="forgotPassword($event)">
              Forgot Password?
            </a>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="btn-login"
            [disabled]="loginForm.invalid || loading"
            [class.loading]="loading"
          >
            <div class="btn-content">
              <span class="btn-text" *ngIf="!loading">
                <i class="fas fa-sign-in-alt"></i>
                Sign In
              </span>
              <span class="btn-text" *ngIf="loading">
                <div class="loading-spinner"></div>
                Signing In...
              </span>
            </div>
            <div class="btn-shine"></div>
          </button>

          <!-- Social Login -->
          <!--<div class="social-login">
            <div class="divider">
              <span class="divider-text">Or continue with</span>
            </div>
            <div class="social-buttons">
              <button
                type="button"
                class="btn-social google"
                (click)="loginWithGoogle()"
                [disabled]="loading"
              >
                <i class="fab fa-google"></i>
                <span>Google</span>
              </button>
              <button
                type="button"
                class="btn-social facebook"
                (click)="loginWithFacebook()"
                [disabled]="loading"
              >
                <i class="fab fa-facebook-f"></i>
                <span>Facebook</span>
              </button>
            </div>
          </div>-->
        </form>

        <!-- Register Link -->
        <div class="register-link">
          <p class="register-text">
            Don't have an account?
            <a routerLink="/register" class="register-btn">
              Create Account
              <i class="fas fa-arrow-right"></i>
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>

<!--modal for otp input-->
<ng-template #content let-c="close" let-d="dismiss">
  <div class="modal-header">
    <h4 class="modal-title" id="modal-basic-title">Enter Your OTP Here</h4>
    <button type="button" class="btn-close" aria-label="Close" (click)="d('Cross click')"></button>
  </div>
  <div class="modal-body">
    <!--OTP input field-->
    <div class="form-group">
      <div class="input-wrapper">
        <label for="otp" class="col-lg-4">OTP</label>
        <input
          type="text"
          id="otp"
          class="form-control"
          placeholder="Enter OTP"
          maxlength="6"
          [(ngModel)]="otp"
          name="otp"
        >
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline-secondary"
      (click)="verifyOTP(content)"
    >
      Save
    </button>
    <!--reSend OTP Button-->
    <button
      type="button"
      class="btn btn-outline-primary"
      (click)="resendOTP()"
      [disabled]="resendDisabled"
    >
      Resend OTP
    </button>
  </div>
</ng-template>
