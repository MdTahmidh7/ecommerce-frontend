<div class="card p-4 shadow-sm w-100" style="max-width: 450px;">
  <div class="card-body">
    <h2 class="card-title text-center mb-4 display-5 fw-bold text-dark">Login</h2>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-envelope" viewBox="0 0 16 16">
              <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.5L8 9.352 1 5.5V12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1z"/>
            </svg>
          </span>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            autocomplete="email"
            required
            [(ngModel)]="email"
            placeholder="you@example.com"
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
              <path d="M8 1a2 2 0 0 0-2 2v4H5a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1H10V3a4 4 0 0 0-8 0v4H3a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1H8V3zm-2 1v3h4V3a2 2 0 0 0-4 0"/>
            </svg>
          </span>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            autocomplete="current-password"
            required
            [(ngModel)]="password"
            placeholder="••••••••"
          />
        </div>
      </div>

      <div class="d-flex justify-content-end mb-3">
        <a href="#" class="text-decoration-none">Forgot your password?</a>
      </div>

      <div class="d-grid gap-2">
        <button
          type="submit"
          class="btn btn-primary btn-lg"
          [disabled]="loading"
        >
          <span *ngIf="!loading">Sign in</span>
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          <span *ngIf="loading">Signing in...</span>
        </button>
      </div>
    </form>
    <div class="text-center mt-3">
      <p class="text-muted">
        Not a member?
        <a routerLink="/register" class="text-decoration-none">Register for an account</a>
      </p>
    </div>
  </div>
</div>
