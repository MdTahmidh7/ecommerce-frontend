<div class="d-flex flex-column min-vh-100 bg-light">
  <!-- Navbar Component -->
  <app-navbar (messageEvent)="setMessage($event)"></app-navbar>

  <!-- Main Content Area -->
  <main class="container flex-grow-1 py-4 d-flex flex-column align-items-center justify-content-center">
    <!-- Message Display (Bootstrap Alert) -->
    <div *ngIf="message" class="alert alert-info alert-dismissible fade show w-100" role="alert">
      {{ message }}
      <button type="button" class="btn-close" aria-label="Close" (click)="clearMessage()"></button>
    </div>
    <router-outlet></router-outlet>
  </main>

  <!-- Footer -->
  <footer class="text-white text-center py-3 mt-auto" style="background: #919191">
    <div class="container">
      &copy; {{ currentYear }} E-Commerce App. All rights reserved.
    </div>
  </footer>
</div>
