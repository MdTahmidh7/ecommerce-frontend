<header class="navbar-wrapper">
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container-fluid px-lg-5">
      <!-- Brand Logo -->
      <a class="navbar-brand brand-logo" routerLink="/home">
        <i class="fas fa-shopping-bag me-2"></i>
        <span class="brand-text">ShopZone</span>
      </a>

      <!-- Mobile Toggle Button -->
      <button
        class="navbar-toggler custom-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="toggler-line"></span>
        <span class="toggler-line"></span>
        <span class="toggler-line"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <!-- Main Navigation Links -->
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <ng-container *ngIf="!isAdmin">
            <li class="nav-item">
              <a (click)="closeNavbar()" class="nav-link nav-link-custom" routerLink="/home" routerLinkActive="active" ariaCurrentWhenActive="page">
                <i class="fas fa-home me-1"></i>Home
              </a>
            </li>
            <li class="nav-item">
              <a (click)="closeNavbar()" class="nav-link nav-link-custom" routerLink="/products" routerLinkActive="active" ariaCurrentWhenActive="page">
                <i class="fas fa-box me-1"></i>Products
              </a>
            </li>
            <li class="nav-item">
              <a (click)="closeNavbar()" class="nav-link nav-link-custom" routerLink="/about" routerLinkActive="active" ariaCurrentWhenActive="page">
                <i class="fas fa-info-circle me-1"></i>About
              </a>
            </li>
            <!--My orders-->
            <li class="nav-item" *ngIf="isAuthenticated">
              <a (click)="closeNavbar()" class="nav-link nav-link-custom" routerLink="/my-orders" routerLinkActive="active" ariaCurrentWhenActive="page">
                <i class="fas fa-shopping-bag me-1"></i>My Orders
              </a>
            </li>
          </ng-container>
          <ng-container *ngIf="isAdmin">
            <li class="nav-item">
              <a (click)="closeNavbar()" class="nav-link nav-link-custom" routerLink="/admin/create-product" routerLinkActive="active">Create Product</a>
            </li>
            <li class="nav-item">
              <a (click)="closeNavbar()" class="nav-link nav-link-custom" routerLink="/admin/products" routerLinkActive="active">Show all products</a>
            </li>
            <li class="nav-item">
              <a (click)="closeNavbar()" class="nav-link nav-link-custom" routerLink="/admin/orders" routerLinkActive="active">Show all orders</a>
            </li>
            <li class="nav-item">
              <a (click)="closeNavbar()" class="nav-link nav-link-custom" routerLink="/admin/analytics" routerLinkActive="active">Analytics</a>
            </li>
          </ng-container>
        </ul>

        <!-- Right Side Navigation -->
        <ul class="navbar-nav align-items-center">
          <!-- Shopping Cart -->
          <!--<li class="nav-item me-3" *ngIf="isAuthenticated && !isAdmin">
            <a class="nav-link cart-link" routerLink="/cart" title="Shopping Cart">
              <i class="fas fa-shopping-cart"></i>
              <span class="cart-badge">3</span>
            </a>
          </li>-->

          <!-- Authentication Links -->
          <ng-container *ngIf="!isAuthenticated && !isAdmin">
            <li class="nav-item me-2 nav-link-custom btn-sm p-0">
              <a (click)="closeNavbar()" class="nav-link auth-link login-link" routerLink="/login" routerLinkActive="active">
                <i class="fas fa-sign-in-alt me-1"></i>Login
              </a>
            </li>
            <li class="nav-item">
              <a (click)="closeNavbar()" class="btn btn-register" routerLink="/register">
                <i class="fas fa-user-plus me-1"></i>Sign Up
              </a>
            </li>
          </ng-container>

          <!-- User Profile & Logout -->
          <li class="nav-item dropdown" *ngIf="isAuthenticated || isAdmin">
            <a class="nav-link dropdown-toggle user-dropdown" href="#" id="navbarDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <div class="user-avatar">
                <i class="fas fa-user"></i>
              </div>
              <span class="user-name ms-2">{{userName}}</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end user-menu" aria-labelledby="navbarDropdown">
              <ng-container *ngIf="!isAdmin">
<!--                <li><a class="dropdown-item" routerLink="/profile"><i class="fas fa-user-circle me-2"></i>Profile</a></li>-->
<!--                <li><a class="dropdown-item" routerLink="/my-orders"><i class="fas fa-box me-2"></i>My Orders</a></li>-->
<!--                <li><a class="dropdown-item" routerLink="/wishlist"><i class="fas fa-heart me-2"></i>Wishlist</a></li>-->
                <li><hr class="dropdown-divider"></li>
              </ng-container>
              <li><button class="dropdown-item logout-btn" (click)="logout()"><i class="fas fa-sign-out-alt me-2"></i>Logout</button></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
