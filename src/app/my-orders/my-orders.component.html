<div class="container my-5">
  <h2 class="text-center mb-4">My Orders</h2>

  <div *ngIf="loading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p>Loading orders...</p>
  </div>

  <div *ngIf="error" class="alert alert-danger" role="alert">
    {{ error }}
  </div>

  <div *ngIf="!loading && !error">
    <div *ngIf="orders.length === 0" class="alert alert-info text-center" role="alert">
      You haven't placed any orders yet.
    </div>

    <div *ngIf="orders.length > 0" class="table-responsive">
      <table class="table table-striped table-hover">
        <thead class="table-dark">
          <tr>
            <th scope="col">Order ID</th>
            <th scope="col">Order Date</th>
            <th scope="col">Total Amount</th>
            <th scope="col">Status</th>
            <!-- Add more columns as needed, e.g., Actions -->
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of orders">
            <td>{{ order.id }}</td>
            <td>{{ order.orderDate | date:'mediumDate' }}</td>
            <td>{{ order.totalAmount | currency:'USD' }}</td>
            <td><span class="badge" [ngClass]="{
              'bg-success': order.status === 'DELIVERED',
              'bg-warning text-dark': order.status === 'PENDING',
              'bg-info text-dark': order.status === 'SHIPPED',
              'bg-danger': order.status === 'CANCELLED'
            }">{{ order.status }}</span></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
