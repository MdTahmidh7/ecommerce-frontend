<div class="card p-4 shadow-sm w-100" style="max-width: 450px;">
  <div class="card-body">
    <h2 class="card-title text-center mb-4 display-5 fw-bold text-dark">Register</h2>
    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">
      <div class="mb-3">
        <label for="fullName" class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
              <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.28 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
            </svg>
          </span>
          <input
            type="text"
            class="form-control"
            id="fullName"
            name="fullName"
            autocomplete="name"
            required
            [(ngModel)]="fullName"
            placeholder="John Doe"
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-envelope" viewBox="0 0 16 16">
              <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v.217l7 4.2 7-4.2V4a1 1 0 0 0-1-1zm13 2.5L8 9.352 1 5.5V12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1z"/>
            </svg>
          </span>
          <input
            type="email"
            class="form-control"
            id="email"
            name="email"
            autocomplete="email"
            required
            [(ngModel)]="email"
            placeholder="you@example.com"
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
              <path d="M8 1a2 2 0 0 0-2 2v4H5a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1H10V3a4 4 0 0 0-8 0v4H3a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1H8V3zm-2 1v3h4V3a2 2 0 0 0-4 0"/>
            </svg>
          </span>
          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            autocomplete="new-password"
            required
            [(ngModel)]="password"
            placeholder="••••••••"
          />
        </div>
      </div>

      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lock" viewBox="0 0 16 16">
              <path d="M8 1a2 2 0 0 0-2 2v4H5a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1H10V3a4 4 0 0 0-8 0v4H3a1 1 0 0 0-1 1v2a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1H8V3zm-2 1v3h4V3a2 2 0 0 0-4 0"/>
            </svg>
          </span>
          <input
            type="password"
            class="form-control"
            id="confirmPassword"
            name="confirmPassword"
            autocomplete="new-password"
            required
            [(ngModel)]="confirmPassword"
            placeholder="••••••••"
          />
        </div>
      </div>

      <div class="d-grid gap-2">
        <button
          type="submit"
          class="btn btn-success btn-lg"
          [disabled]="loading || password !== confirmPassword"
        >
          <span *ngIf="!loading">Register</span>
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          <span *ngIf="loading">Registering...</span>
        </button>
      </div>
    </form>
    <div class="text-center mt-3">
      <p class="text-muted">
        Already have an account?
        <a routerLink="/login" class="text-decoration-none">Login</a>
      </p>
    </div>
  </div>
</div>
