<div class="create-product-container">
  <h2>Create New Product</h2>
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="name">Product Name</label>
      <input type="text" id="name" formControlName="name" class="form-control">
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description" class="form-control"></textarea>
    </div>

    <div class="form-group">
      <label for="price">Price</label>
      <input type="number" id="price" formControlName="price" class="form-control">
    </div>

    <div class="form-group">
      <label for="stockQuantity">Stock Quantity</label>
      <input type="number" id="stockQuantity" formControlName="stockQuantity" class="form-control">
    </div>

    <div class="form-group">
      <label for="categoryId">Category ID</label>
      <input type="number" id="categoryId" formControlName="categoryId" class="form-control">
    </div>

    <div class="form-group">
      <label for="images">Images</label>
      <input type="file" id="images" (change)="onFileSelect($event)" multiple class="form-control">
    </div>

    <button type="submit" [disabled]="productForm.invalid" class="btn btn-primary">Create Product</button>
  </form>
</div>
