<div class="login-container">
  <div class="card login-card">
    <div class="card-body p-4 p-md-5">
      <h2 class="card-title text-center mb-4 fw-bold">Admin Login</h2>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3 position-relative">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text login-icon-container">
              <!-- User Icon -->
              <svg class="login-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </span>
            <input type="text" id="username" formControlName="username"
                   class="form-control"
                   [ngClass]="{'is-invalid': loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty || loginForm.get('username')?.touched)}"
                   placeholder="Enter your username">
            <div *ngIf="loginForm.get('username')?.invalid && (loginForm.get('username')?.dirty || loginForm.get('username')?.touched)" class="invalid-feedback">
              Username is required.
            </div>
          </div>
        </div>

        <div class="mb-3 position-relative">
          <label for="phoneNumber" class="form-label">Phone Number</label>
          <div class="input-group">
            <span class="input-group-text login-icon-container">
              <!-- Phone Icon -->
              <svg class="login-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
              </svg>
            </span>
            <input type="text" id="phoneNumber" formControlName="phoneNumber"
                   class="form-control"
                   [ngClass]="{'is-invalid': loginForm.get('phoneNumber')?.invalid && (loginForm.get('phoneNumber')?.dirty || loginForm.get('phoneNumber')?.touched)}"
                   placeholder="Enter your phone number">
            <div *ngIf="loginForm.get('phoneNumber')?.errors?.['required'] && (loginForm.get('phoneNumber')?.dirty || loginForm.get('phoneNumber')?.touched)" class="invalid-feedback">
              Phone Number is required.
            </div>
            <div *ngIf="loginForm.get('phoneNumber')?.errors?.['pattern'] && (loginForm.get('phoneNumber')?.dirty || loginForm.get('phoneNumber')?.touched)" class="invalid-feedback">
              Phone Number must be 10 digits.
            </div>
          </div>
        </div>

        <div class="mb-4 position-relative">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text login-icon-container">
              <!-- Lock Icon -->
              <svg class="login-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
            </span>
            <input type="password" id="password" formControlName="password"
                   class="form-control"
                   [ngClass]="{'is-invalid': loginForm.get('password')?.invalid && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)}"
                   placeholder="Enter your password">
            <div *ngIf="loginForm.get('password')?.errors?.['required'] && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" class="invalid-feedback">
              Password is required.
            </div>
            <div *ngIf="loginForm.get('password')?.errors?.['minlength'] && (loginForm.get('password')?.dirty || loginForm.get('password')?.touched)" class="invalid-feedback">
              Password must be at least 8 characters.
            </div>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary btn-lg login-button">
            Login
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
