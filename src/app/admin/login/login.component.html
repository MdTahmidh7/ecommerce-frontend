<div class="container admin-login-container py-5">
  <div class="row justify-content-center align-items-center min-vh-100">
    <div class="">

      <div class="card card-light-futuristic shadow-lg rounded-4 p-4 p-md-5 border-0">
        <div class="text-center mb-5">
          <i class="fa-solid fa-user-lock fa-3x text-accent mb-3"></i>
          <h2 class="fw-bolder text-dark">SYSTEM ACCESS</h2>
          <p class="text-muted">Administrator Authentication Required</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit(otpModal)">
          <div class="mb-4">
            <label for="name" class="form-label text-dark">User Name</label>
            <input type="text" id="name" formControlName="name"
                   class="form-control light-futuristic-input"
                   [ngClass]="{'is-invalid': isFieldInvalid('name')}">
            <div class="invalid-feedback">Access Name is required.</div>
          </div>

          <div class="mb-4">
            <label for="phoneNumber" class="form-label text-dark">Security ID (Phone)</label>
            <input type="text" id="phoneNumber" formControlName="phoneNumber"
                   class="form-control light-futuristic-input"
                   [ngClass]="{'is-invalid': isFieldInvalid('phoneNumber')}">
            <div class="invalid-feedback">Security ID (Phone) is required.</div>
          </div>

          <button type="submit" class="btn light-glow-btn w-100 py-2 mt-3" [disabled]="loginForm.invalid || loading">
            <span *ngIf="!loading"><i class="fa-solid fa-fingerprint me-2"></i>INITIATE AUTHORIZATION</span>
            <span *ngIf="loading"><span class="spinner-border spinner-border-sm me-2"></span>Transmitting Data...</span>
          </button>
        </form>

        <div *ngIf="errorMessage" class="alert alert-danger mt-4 text-center animate__animated animate__shakeX">
          {{ errorMessage }}
        </div>
      </div>
    </div>
  </div>

  <ng-template #otpModal let-modal>
    <div class="modal-content card-light-futuristic rounded-4 border-0 shadow-lg">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold text-dark">ENTER VERIFICATION KEY</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('cancel')"></button>
      </div>
      <div class="modal-body pt-2">
        <p class="text-muted text-center">6-Digit Code Transmitted to Designated ID.</p>

        <div class="d-flex justify-content-center gap-2 mb-4">
          <input
            *ngFor="let i of [0, 1, 2, 3, 4, 5]; let idx = index"
            #otpInput
            type="text"
            maxlength="1"
            class="form-control text-center light-otp-field"
            (input)="onOtpChange($event, idx)"
            [attr.id]="'otp-input-' + idx"
          >
        </div>

        <div class="text-center small">
          <span class="text-muted">No Transmission Received?</span>
          <a href="#" (click)="resendOTP()" [ngClass]="{'text-muted': resendDisabled, 'text-accent-link': !resendDisabled}" class="fw-bold text-decoration-none ms-1">
            Re-Transmit Key
          </a>
          <span *ngIf="resendDisabled" class="text-muted">({{ countdown }}s)</span>
        </div>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button type="button" class="btn btn-outline-secondary rounded-pill" (click)="modal.dismiss('cancel')">Cancel</button>
        <button type="button" class="btn light-glow-btn rounded-pill" (click)="verifyOTP()" [disabled]="otp.length !== 6">
          <i class="fa-solid fa-check me-1"></i>CONFIRM KEY
        </button>
      </div>
    </div>
  </ng-template>
</div>
