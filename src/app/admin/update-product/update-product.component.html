<div class="product-creation-page py-5">
  <div class="container">
    <div class="card product-form-card shadow-lg border-0 mx-auto">
      <div class="card-body p-4 p-md-5">
        <h2 class="card-title text-center mb-4 pb-2 border-bottom">
          <i class="fas fa-edit me-2 text-primary"></i>
          Update Product (ID: {{ productId }})
        </h2>

        <div *ngIf="isLoading" class="text-center py-5">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
          <p class="mt-3 text-muted">Loading product details...</p>
        </div>

        <form [formGroup]="productForm" (ngSubmit)="onSubmit()" *ngIf="!isLoading">
          <div class="row g-3 mb-3">
            <div class="col-12">
              <label for="name" class="form-label required">Product Name</label>
              <input type="text" id="name" formControlName="name" class="form-control form-control-lg" placeholder="e.g., UltraBoost Running Shoe">
            </div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-12">
              <label class="form-label required">Description</label>

              <div class="rich-text-editor-wrapper">
                <ngx-editor-menu [editor]="editor" [toolbar]="toolbar" class="modern-toolbar"></ngx-editor-menu>
                <ngx-editor
                  [editor]="editor"
                  formControlName="description"
                  [placeholder]="'Describe the product details, features, and material...'"
                  class="rich-text-body"
                ></ngx-editor>
              </div>
            </div>
          </div>

          <div class="row g-3 mb-4">
            <div class="col-md-6">
              <label for="price" class="form-label required">Price</label>
              <div class="input-group">
                <span class="input-group-text">TAKA</span>
                <input type="number" id="price" formControlName="price" class="form-control" placeholder="0.00">
              </div>
            </div>
            <div class="col-md-6">
              <label for="stockQuantity" class="form-label required">Stock Quantity</label>
              <input type="number" id="stockQuantity" formControlName="stockQuantity" class="form-control" placeholder="Number of units">
            </div>
          </div>

<!--          <div class="row mb-4">-->
<!--            <div class="col-12">-->
<!--              <label for="categoryId" class="form-label required">Category</label>-->
<!--              <select id="categoryId" formControlName="categoryId" class="form-select">-->
<!--                <option [value]="null" disabled>Select a product category</option>-->
<!--                <option *ngFor="let category of categories" [value]="category.id">{{ category.name }}</option>-->
<!--              </select>-->
<!--            </div>-->
<!--          </div>-->

          <div class="row mb-5">
            <div class="col-12 image-upload-group">
              <label class="form-label required">Product Images (Max 5)</label>

              <input
                type="file"
                #fileInput
                id="images"
                class="form-control"
                (change)="onFileSelect($event)"
                multiple accept="image/*"
              >

              <div class="file-upload-area" (click)="fileInput.click()">
                <p class="mb-1">Drag & drop or <span class="text-primary fw-bold">click to add new images</span></p>
                <small class="text-muted" *ngIf="selectedFiles.length === 0">No images selected</small>
                <small class="text-success fw-bold" *ngIf="selectedFiles.length > 0">
                  {{ selectedFiles.length }} of 5 images selected ({{ newImageCount() }} new)
                </small>
              </div>

              <div class="mt-3 row justify-content-center align-items-center">
                <div *ngFor="let file of selectedFiles"
                     class="image-preview shadow-sm col-lg-2 col-md-3 col-12"
                     [ngClass]="{'new-image-border': file.isNew}"
                >
                  <img [src]="file.url" [alt]="file.name" class="img-fluid" style="width: 100%; height: auto; object-fit: cover;">
                  <span class="remove-image" (click)="removeImage(file.name)">
                    <i class="fas fa-times-circle"></i>
                  </span>
                  <span *ngIf="file.isNew" class="badge bg-success new-badge">NEW</span>
                </div>
              </div>

              <div *ngIf="selectedFiles.length > 5" class="alert alert-danger mt-3 p-2 animate__animated animate__shakeX error-message" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                You can select up to 5 images only.
              </div>
            </div>
          </div>

          <div class="d-grid gap-2">
            <button
              type="submit"
              [disabled]="productForm.invalid || selectedFiles.length === 0 || selectedFiles.length > 5"
              class="btn btn-warning btn-lg update-btn animate__animated animate__pulse"
            >
              <i class="fas fa-save me-2"></i>
              Update Product
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
